; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = 01_src

[env:esp32-c3-devkitm-1]
; Pinned platform — 6.7.0 ships ESP-IDF 5.1 with the rewritten RMT driver
; that fixes the FastLED ISR recursion crash on ESP32-C3.
platform = espressif32 @ 6.7.0
;board = seeed_xiao_esp32c3
board = esp32-c3-devkitm-1
framework = arduino
;framework = espidf

monitor_speed = 115200

; Build flags — FastLED safety + serial debug
build_flags =
	-D FASTLED_RMT_MAX_CHANNELS=1     ; ESP32-C3 has only 2 RMT channels
	-D FASTLED_RMT_BUILTIN_DRIVER=1   ; use IDF's tested RMT driver

lib_deps =
	RemoteXY
	fastled/FastLED @ ^3.7.0
	madhephaestus/ESP32Servo
	adafruit/Adafruit GFX Library
	adafruit/Adafruit SSD1306

;board_build.usb_cdc = true
; Enable CDC for serial communication
;build_flags =
;    -DARDUINO_USB_CDC_ON_BOOT=1
